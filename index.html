<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Víctor Manuel Única Salas · CEIP Capitulaciones de Santa Fe (Granada)">
<meta name="copyright" content="© Víctor Manuel Única Salas · CEIP Capitulaciones · CC BY-NC-SA 4.0">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MateMágica - App de Matemáticas</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Generador de problemas matemáticos por curso
        const generarProblema = (curso, trimestre) => {
            const problemas = {
                1: {
                    1: () => {
                        const a = Math.floor(Math.random() * 10) + 1;
                        const b = Math.floor(Math.random() * 10) + 1;
                        return {
                            pregunta: `¿Cuánto es ${a} + ${b}?`,
                            respuesta: a + b,
                            tipo: 'suma'
                        };
                    },
                    2: () => {
                        const a = Math.floor(Math.random() * 15) + 1;
                        const b = Math.floor(Math.random() * 10) + 1;
                        if (a < b) [a, b] = [b, a];
                        return {
                            pregunta: `¿Cuánto es ${a} - ${b}?`,
                            respuesta: a - b,
                            tipo: 'resta'
                        };
                    },
                    3: () => {
                        const a = Math.floor(Math.random() * 10) + 1;
                        const b = Math.floor(Math.random() * 10) + 1;
                        return {
                            pregunta: `María tiene ${a} caramelos y Juan le da ${b} más. ¿Cuántos tiene ahora?`,
                            respuesta: a + b,
                            tipo: 'problema'
                        };
                    }
                },
                2: {
                    1: () => {
                        const a = Math.floor(Math.random() * 20) + 1;
                        const b = Math.floor(Math.random() * 20) + 1;
                        return {
                            pregunta: `¿Cuánto es ${a} + ${b}?`,
                            respuesta: a + b,
                            tipo: 'suma'
                        };
                    },
                    2: () => {
                        const a = Math.floor(Math.random() * 30) + 10;
                        const b = Math.floor(Math.random() * 15) + 1;
                        return {
                            pregunta: `¿Cuánto es ${a} - ${b}?`,
                            respuesta: a - b,
                            tipo: 'resta'
                        };
                    },
                    3: () => {
                        const a = Math.floor(Math.random() * 15) + 5;
                        const b = Math.floor(Math.random() * 10) + 1;
                        return {
                            pregunta: `En una cesta hay ${a} manzanas. Si se comen ${b}, ¿cuántas quedan?`,
                            respuesta: a - b,
                            tipo: 'problema'
                        };
                    }
                },
                3: {
                    1: () => {
                        const a = Math.floor(Math.random() * 10) + 2;
                        const b = Math.floor(Math.random() * 10) + 2;
                        return {
                            pregunta: `¿Cuánto es ${a} × ${b}?`,
                            respuesta: a * b,
                            tipo: 'multiplicación'
                        };
                    },
                    2: () => {
                        const b = Math.floor(Math.random() * 9) + 2;
                        const resultado = Math.floor(Math.random() * 10) + 2;
                        const a = b * resultado;
                        return {
                            pregunta: `¿Cuánto es ${a} ÷ ${b}?`,
                            respuesta: resultado,
                            tipo: 'división'
                        };
                    },
                    3: () => {
                        const a = Math.floor(Math.random() * 8) + 2;
                        const b = Math.floor(Math.random() * 6) + 2;
                        return {
                            pregunta: `Si una caja tiene ${a} chocolates, ¿cuántos chocolates hay en ${b} cajas?`,
                            respuesta: a * b,
                            tipo: 'problema'
                        };
                    }
                },
                4: {
                    1: () => {
                        const a = Math.floor(Math.random() * 12) + 2;
                        const b = Math.floor(Math.random() * 12) + 2;
                        return {
                            pregunta: `¿Cuánto es ${a} × ${b}?`,
                            respuesta: a * b,
                            tipo: 'multiplicación'
                        };
                    },
                    2: () => {
                        const b = Math.floor(Math.random() * 12) + 2;
                        const resultado = Math.floor(Math.random() * 15) + 2;
                        const a = b * resultado;
                        return {
                            pregunta: `¿Cuánto es ${a} ÷ ${b}?`,
                            respuesta: resultado,
                            tipo: 'división'
                        };
                    },
                    3: () => {
                        const a = Math.floor(Math.random() * 50) + 20;
                        const b = Math.floor(Math.random() * 30) + 10;
                        const c = Math.floor(Math.random() * 20) + 5;
                        return {
                            pregunta: `Tienes ${a} euros. Gastas ${b} euros en un juego y ${c} en un libro. ¿Cuánto te queda?`,
                            respuesta: a - b - c,
                            tipo: 'problema'
                        };
                    }
                },
                5: {
                    1: () => {
                        const numerador = Math.floor(Math.random() * 5) + 1;
                        const denominador = Math.floor(Math.random() * 5) + 2;
                        return {
                            pregunta: `¿Cuánto es ${numerador}/${denominador} + ${numerador}/${denominador}? (responde solo el numerador)`,
                            respuesta: numerador * 2,
                            tipo: 'fracciones'
                        };
                    },
                    2: () => {
                        const a = (Math.floor(Math.random() * 50) + 10) / 10;
                        const b = (Math.floor(Math.random() * 50) + 10) / 10;
                        return {
                            pregunta: `¿Cuánto es ${a.toFixed(1)} + ${b.toFixed(1)}?`,
                            respuesta: parseFloat((a + b).toFixed(1)),
                            tipo: 'decimales'
                        };
                    },
                    3: () => {
                        const base = Math.floor(Math.random() * 8) + 3;
                        const altura = Math.floor(Math.random() * 8) + 3;
                        return {
                            pregunta: `¿Cuál es el área de un rectángulo de ${base} cm de base y ${altura} cm de altura?`,
                            respuesta: base * altura,
                            tipo: 'geometría'
                        };
                    }
                },
                6: {
                    1: () => {
                        const a = (Math.floor(Math.random() * 90) + 10) / 10;
                        const b = (Math.floor(Math.random() * 90) + 10) / 10;
                        return {
                            pregunta: `¿Cuánto es ${a.toFixed(1)} × ${b.toFixed(1)}?`,
                            respuesta: parseFloat((a * b).toFixed(1)),
                            tipo: 'decimales'
                        };
                    },
                    2: () => {
                        const num = Math.floor(Math.random() * 80) + 20;
                        const porcentaje = [10, 20, 25, 50, 75][Math.floor(Math.random() * 5)];
                        return {
                            pregunta: `¿Cuánto es el ${porcentaje}% de ${num}?`,
                            respuesta: (num * porcentaje) / 100,
                            tipo: 'porcentajes'
                        };
                    },
                    3: () => {
                        const lado = Math.floor(Math.random() * 8) + 4;
                        return {
                            pregunta: `¿Cuál es el área de un cuadrado de lado ${lado} cm?`,
                            respuesta: lado * lado,
                            tipo: 'geometría'
                        };
                    }
                }
            };

            const trimestresDisponibles = problemas[curso];
            const generador = trimestresDisponibles[trimestre];
            return generador ? generador() : problemas[curso][1]();
        };

        // Componente principal
        function AppMatematicas() {
            const [pantalla, setPantalla] = useState('seleccion'); // 'seleccion', 'perfil', 'juego'
            const [perfiles, setPerfiles] = useState([]);
            const [perfilActual, setPerfilActual] = useState(null);
            const [problema, setProblema] = useState(null);
            const [respuesta, setRespuesta] = useState('');
            const [mostrarResultado, setMostrarResultado] = useState(false);
            const [esCorrecto, setEsCorrecto] = useState(false);
            const [animacion, setAnimacion] = useState(false);

            // Cargar perfiles del localStorage al iniciar
            useEffect(() => {
                const perfilesGuardados = localStorage.getItem('perfilesMatematicas');
                if (perfilesGuardados) {
                    setPerfiles(JSON.parse(perfilesGuardados));
                }
            }, []);

            // Guardar perfiles cuando cambien
            useEffect(() => {
                if (perfiles.length > 0) {
                    localStorage.setItem('perfilesMatematicas', JSON.stringify(perfiles));
                }
            }, [perfiles]);

            const crearPerfil = (nombre, curso, avatar) => {
                const nuevoPerfil = {
                    id: Date.now(),
                    nombre,
                    curso: parseInt(curso),
                    avatar,
                    nivel: 1,
                    xp: 0,
                    xpParaSiguienteNivel: 100,
                    estrellas: 0,
                    racha: 0,
                    monedas: 100,
                    ultimoAcceso: new Date().toDateString(),
                    problemasResueltos: 0,
                    problemasCorrectos: 0,
                    misiones: generarMisionesDiarias(),
                    logros: {
                        primeraVictoria: false,
                        velocista: false,
                        cienProblemas: false,
                        racha7: false,
                        nivel10: false,
                        expertSumas: false
                    }
                };
                setPerfiles([...perfiles, nuevoPerfil]);
                return nuevoPerfil;
            };

            const generarMisionesDiarias = () => [
                { texto: "Resuelve 5 problemas", progreso: 0, total: 5, completada: false, recompensa: 50 },
                { texto: "Consigue 3 respuestas perfectas", progreso: 0, total: 3, completada: false, recompensa: 30 },
                { texto: "Usa la app hoy", progreso: 0, total: 1, completada: false, recompensa: 20 }
            ];

            const seleccionarPerfil = (perfil) => {
                // Verificar si es un nuevo día y resetear misiones
                const hoy = new Date().toDateString();
                if (perfil.ultimoAcceso !== hoy) {
                    perfil.ultimoAcceso = hoy;
                    perfil.racha += 1;
                    perfil.misiones = generarMisionesDiarias();
                    perfil.misiones[2].progreso = 1;
                    perfil.misiones[2].completada = true;
                    perfil.monedas += 20;
                }
                
                setPerfilActual(perfil);
                generarNuevoProblema(perfil.curso);
                setPantalla('juego');
            };

            const generarNuevoProblema = (curso) => {
                const trimestre = Math.floor(Math.random() * 3) + 1;
                const nuevoProblema = generarProblema(curso, trimestre);
                setProblema({ ...nuevoProblema, curso, trimestre });
                setRespuesta('');
                setMostrarResultado(false);
                setEsCorrecto(false);
            };

            const verificarRespuesta = () => {
                if (!respuesta) return;
                
                const respuestaNum = parseFloat(respuesta);
                const correcto = Math.abs(respuestaNum - problema.respuesta) < 0.1;
                setEsCorrecto(correcto);
                setMostrarResultado(true);
                setAnimacion(true);

                // Actualizar perfil
                const perfilActualizado = { ...perfilActual };
                perfilActualizado.problemasResueltos += 1;

                if (correcto) {
                    const xpGanado = 25;
                    perfilActualizado.problemasCorrectos += 1;
                    perfilActualizado.xp += xpGanado;
                    perfilActualizado.estrellas += 3;
                    perfilActualizado.monedas += 10;

                    // Actualizar misiones
                    if (perfilActualizado.misiones[0].progreso < perfilActualizado.misiones[0].total) {
                        perfilActualizado.misiones[0].progreso += 1;
                        if (perfilActualizado.misiones[0].progreso >= perfilActualizado.misiones[0].total) {
                            perfilActualizado.misiones[0].completada = true;
                            perfilActualizado.monedas += perfilActualizado.misiones[0].recompensa;
                        }
                    }
                    
                    if (perfilActualizado.misiones[1].progreso < perfilActualizado.misiones[1].total) {
                        perfilActualizado.misiones[1].progreso += 1;
                        if (perfilActualizado.misiones[1].progreso >= perfilActualizado.misiones[1].total) {
                            perfilActualizado.misiones[1].completada = true;
                            perfilActualizado.monedas += perfilActualizado.misiones[1].recompensa;
                        }
                    }

                    // Subir de nivel
                    while (perfilActualizado.xp >= perfilActualizado.xpParaSiguienteNivel) {
                        perfilActualizado.nivel += 1;
                        perfilActualizado.xp -= perfilActualizado.xpParaSiguienteNivel;
                        perfilActualizado.xpParaSiguienteNivel = Math.floor(perfilActualizado.xpParaSiguienteNivel * 1.5);
                        perfilActualizado.monedas += 50;
                    }

                    // Actualizar logros
                    if (!perfilActualizado.logros.primeraVictoria) {
                        perfilActualizado.logros.primeraVictoria = true;
                    }
                    if (perfilActualizado.problemasResueltos >= 100 && !perfilActualizado.logros.cienProblemas) {
                        perfilActualizado.logros.cienProblemas = true;
                        perfilActualizado.monedas += 100;
                    }
                    if (perfilActualizado.racha >= 7 && !perfilActualizado.logros.racha7) {
                        perfilActualizado.logros.racha7 = true;
                        perfilActualizado.monedas += 150;
                    }
                    if (perfilActualizado.nivel >= 10 && !perfilActualizado.logros.nivel10) {
                        perfilActualizado.logros.nivel10 = true;
                        perfilActualizado.monedas += 200;
                    }
                }

                // Guardar cambios
                setPerfilActual(perfilActualizado);
                const nuevosPerfiles = perfiles.map(p => p.id === perfilActualizado.id ? perfilActualizado : p);
                setPerfiles(nuevosPerfiles);

                setTimeout(() => setAnimacion(false), 1000);
            };

            const siguienteProblema = () => {
                generarNuevoProblema(perfilActual.curso);
            };

            // Pantalla de selección de perfil
            if (pantalla === 'seleccion') {
                return <PantallaSeleccion 
                    perfiles={perfiles} 
                    onSeleccionar={seleccionarPerfil}
                    onNuevo={() => setPantalla('perfil')}
                />;
            }

            // Pantalla de crear perfil
            if (pantalla === 'perfil') {
                return <PantallaCrearPerfil 
                    onCrear={(nombre, curso, avatar) => {
                        const nuevoPerfil = crearPerfil(nombre, curso, avatar);
                        seleccionarPerfil(nuevoPerfil);
                    }}
                    onVolver={() => setPantalla('seleccion')}
                />;
            }

            // Pantalla de juego
            return (
                <PantallaJuego 
                    perfil={perfilActual}
                    problema={problema}
                    respuesta={respuesta}
                    setRespuesta={setRespuesta}
                    mostrarResultado={mostrarResultado}
                    esCorrecto={esCorrecto}
                    animacion={animacion}
                    onVerificar={verificarRespuesta}
                    onSiguiente={siguienteProblema}
                    onVolver={() => setPantalla('seleccion')}
                />
            );
        }

        // Componente: Pantalla de Selección
        function PantallaSeleccion({ perfiles, onSeleccionar, onNuevo }) {
            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-400 via-pink-300 to-blue-300 p-8 flex items-center justify-center">
                    <div className="max-w-4xl w-full">
                        <h1 className="text-6xl font-bold text-white text-center mb-4 drop-shadow-lg">
                            🎮 MateMágica
                        </h1>
                        <p className="text-xl text-white text-center mb-12 drop-shadow">
                            ¡Selecciona tu perfil para comenzar!
                        </p>

                        <div className="grid md:grid-cols-3 gap-6 mb-8">
                            {perfiles.map(perfil => (
                                <button
                                    key={perfil.id}
                                    onClick={() => onSeleccionar(perfil)}
                                    className="bg-white rounded-3xl shadow-2xl p-6 hover:scale-105 transition-transform"
                                >
                                    <div className="text-6xl mb-3">{perfil.avatar}</div>
                                    <h3 className="text-2xl font-bold text-gray-800 mb-2">{perfil.nombre}</h3>
                                    <p className="text-gray-600 mb-2">{perfil.curso}º de Primaria</p>
                                    <div className="bg-purple-100 rounded-xl p-3">
                                        <p className="text-sm text-purple-700 font-semibold">Nivel {perfil.nivel}</p>
                                        <p className="text-xs text-gray-600">{perfil.estrellas} ⭐ • {perfil.racha} 🔥</p>
                                    </div>
                                </button>
                            ))}

                            <button
                                onClick={onNuevo}
                                className="bg-white rounded-3xl shadow-2xl p-6 hover:scale-105 transition-transform border-4 border-dashed border-purple-300"
                            >
                                <div className="text-6xl mb-3">➕</div>
                                <h3 className="text-2xl font-bold text-gray-800">Nuevo Perfil</h3>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Componente: Crear Perfil
        function PantallaCrearPerfil({ onCrear, onVolver }) {
            const [nombre, setNombre] = useState('');
            const [curso, setCurso] = useState('1');
            const [avatar, setAvatar] = useState('👦');

            const avatares = ['👦', '👧', '🧒', '👶', '🐶', '🐱', '🦁', '🐻', '🦊', '🐼', '🦄', '🐯'];

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-400 via-pink-300 to-blue-300 p-8 flex items-center justify-center">
                    <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full">
                        <h2 className="text-3xl font-bold text-gray-800 mb-6 text-center">Crear Perfil</h2>

                        <div className="mb-6">
                            <label className="block text-gray-700 font-semibold mb-2">Nombre:</label>
                            <input
                                type="text"
                                value={nombre}
                                onChange={(e) => setNombre(e.target.value)}
                                className="w-full border-2 border-purple-300 rounded-xl px-4 py-3 focus:border-purple-500 focus:outline-none"
                                placeholder="Escribe tu nombre"
                            />
                        </div>

                        <div className="mb-6">
                            <label className="block text-gray-700 font-semibold mb-2">Curso:</label>
                            <select
                                value={curso}
                                onChange={(e) => setCurso(e.target.value)}
                                className="w-full border-2 border-purple-300 rounded-xl px-4 py-3 focus:border-purple-500 focus:outline-none"
                            >
                                {[1, 2, 3, 4, 5, 6].map(c => (
                                    <option key={c} value={c}>{c}º de Primaria</option>
                                ))}
                            </select>
                        </div>

                        <div className="mb-8">
                            <label className="block text-gray-700 font-semibold mb-3">Elige tu avatar:</label>
                            <div className="grid grid-cols-6 gap-3">
                                {avatares.map(av => (
                                    <button
                                        key={av}
                                        onClick={() => setAvatar(av)}
                                        className={`text-4xl p-3 rounded-xl transition-all ${
                                            avatar === av 
                                                ? 'bg-purple-200 scale-110' 
                                                : 'bg-gray-100 hover:bg-gray-200'
                                        }`}
                                    >
                                        {av}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex gap-3">
                            <button
                                onClick={onVolver}
                                className="flex-1 bg-gray-300 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-400 transition"
                            >
                                Volver
                            </button>
                            <button
                                onClick={() => nombre && onCrear(nombre, curso, avatar)}
                                disabled={!nombre}
                                className="flex-1 bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 rounded-xl font-bold hover:scale-105 transition disabled:opacity-50"
                            >
                                ¡Crear!
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Componente: Juego
        function PantallaJuego({ perfil, problema, respuesta, setRespuesta, mostrarResultado, esCorrecto, animacion, onVerificar, onSiguiente, onVolver }) {
            if (!problema) return null;

            const logrosData = [
                { key: 'primeraVictoria', icono: '🏆', nombre: 'Primera Victoria' },
                { key: 'velocista', icono: '⚡', nombre: 'Velocista' },
                { key: 'cienProblemas', icono: '🌟', nombre: '100 Problemas' },
                { key: 'racha7', icono: '🎯', nombre: 'Racha 7 días' },
                { key: 'nivel10', icono: '🚀', nombre: 'Nivel 10' },
                { key: 'expertSumas', icono: '💎', nombre: 'Experto' }
            ];

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-400 via-pink-300 to-blue-300 p-4">
                    <div className="max-w-6xl mx-auto">
                        
                        {/* Header */}
                        <div className="bg-white rounded-3xl shadow-2xl p-6 mb-4">
                            <div className="flex items-center justify-between flex-wrap gap-4">
                                <button
                                    onClick={onVolver}
                                    className="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-xl font-semibold transition"
                                >
                                    ← Volver
                                </button>

                                <div className="flex items-center gap-4">
                                    <div className="w-16 h-16 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full flex items-center justify-center text-4xl shadow-lg">
                                        {perfil.avatar}
                                    </div>
                                    <div>
                                        <h2 className="text-2xl font-bold text-purple-800">{perfil.nombre}</h2>
                                        <p className="text-gray-600">Nivel {perfil.nivel}</p>
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <div className="text-center">
                                        <div className="text-yellow-500 text-xl font-bold">⭐ {perfil.estrellas}</div>
                                        <p className="text-xs text-gray-600">Estrellas</p>
                                    </div>
                                    <div className="text-center">
                                        <div className="text-orange-500 text-xl font-bold">🔥 {perfil.racha}</div>
                                        <p className="text-xs text-gray-600">Racha</p>
                                    </div>
                                    <div className="text-center">
                                        <div className="text-blue-500 text-xl font-bold">⚡ {perfil.monedas}</div>
                                        <p className="text-xs text-gray-600">Monedas</p>
                                    </div>
                                </div>
                            </div>

                            {/* Barra XP */}
                            <div className="mt-4">
                                <div className="flex items-center justify-between text-sm mb-1">
                                    <span className="font-semibold text-purple-700">Nivel {perfil.nivel}</span>
                                    <span className="text-gray-600">{perfil.xp} / {perfil.xpParaSiguienteNivel} XP</span>
                                </div>
                                <div className="h-4 bg-gray-200 rounded-full overflow-hidden">
                                    <div 
                                        className="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-500 rounded-full"
                                        style={{ width: `${(perfil.xp / perfil.xpParaSiguienteNivel) * 100}%` }}
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-3 gap-4">
                            
                            {/* Panel Principal */}
                            <div className="md:col-span-2">
                                <div className="bg-white rounded-3xl shadow-2xl p-8">
                                    <div className="flex items-center justify-between mb-6">
                                        <span className="bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-sm font-semibold">
                                            {problema.curso}º Primaria • Trimestre {problema.trimestre}
                                        </span>
                                    </div>

                                    <div className="bg-gradient-to-r from-blue-50 to-purple-50 rounded-2xl p-8 mb-6">
                                        <h3 className="text-3xl font-bold text-center text-gray-800 mb-8">
                                            {problema.pregunta}
                                        </h3>

                                        {!mostrarResultado ? (
                                            <div className="flex flex-col items-center gap-4">
                                                <input
                                                    type="number"
                                                    step="0.1"
                                                    value={respuesta}
                                                    onChange={(e) => setRespuesta(e.target.value)}
                                                    onKeyPress={(e) => e.key === 'Enter' && onVerificar()}
                                                    className="text-4xl font-bold text-center border-4 border-purple-300 rounded-2xl px-6 py-4 w-48 focus:border-purple-500 focus:outline-none"
                                                    placeholder="?"
                                                    autoFocus
                                                />
                                                <button
                                                    onClick={onVerificar}
                                                    className="bg-gradient-to-r from-green-400 to-green-600 text-white px-12 py-4 rounded-2xl text-xl font-bold hover:scale-105 transition-transform shadow-lg"
                                                >
                                                    ¡Comprobar!
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="text-center">
                                                {esCorrecto ? (
                                                    <div className={animacion ? 'animate-bounce' : ''}>
                                                        <div className="text-8xl mb-4">🎉</div>
                                                        <h4 className="text-3xl font-bold text-green-600 mb-2">¡Correcto!</h4>
                                                        <div className="bg-yellow-100 rounded-xl p-4 inline-block mb-4">
                                                            <p className="text-xl font-bold text-yellow-700">+25 XP • +10 💰 • +3 ⭐</p>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div>
                                                        <div className="text-6xl mb-4">💪</div>
                                                        <h4 className="text-2xl font-bold text-orange-600 mb-2">¡Casi! Sigue intentándolo</h4>
                                                        <p className="text-gray-600">La respuesta correcta es: {problema.respuesta}</p>
                                                    </div>
                                                )}
                                                <button
                                                    onClick={onSiguiente}
                                                    className="mt-6 bg-gradient-to-r from-blue-400 to-purple-600 text-white px-8 py-3 rounded-2xl text-lg font-bold hover:scale-105 transition-transform shadow-lg"
                                                >
                                                    Siguiente Problema →
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    {/* Estadísticas */}
                                    <div className="border-t-2 border-gray-100 pt-4">
                                        <p className="text-sm text-gray-600">
                                            Problemas resueltos: {perfil.problemasResueltos} • 
                                            Correctos: {perfil.problemasCorrectos} • 
                                            Precisión: {perfil.problemasResueltos > 0 ? Math.round((perfil.problemasCorrectos / perfil.problemasResueltos) * 100) : 0}%
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {/* Sidebar */}
                            <div className="space-y-4">
                                
                                {/* Misiones */}
                                <div className="bg-white rounded-3xl shadow-2xl p-6">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        🎯 Misiones de Hoy
                                    </h3>
                                    <div className="space-y-3">
                                        {perfil.misiones.map((mision, idx) => (
                                            <div key={idx} className="bg-gradient-to-r from-orange-50 to-yellow-50 rounded-xl p-3">
                                                <div className="flex items-start justify-between mb-2">
                                                    <p className="text-sm font-medium text-gray-700 flex-1">{mision.texto}</p>
                                                    {mision.completada && <span className="text-xl">✅</span>}
                                                </div>
                                                <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                                                    <div 
                                                        className="h-full bg-gradient-to-r from-orange-400 to-yellow-400 rounded-full transition-all"
                                                        style={{ width: `${(mision.progreso / mision.total) * 100}%` }}
                                                    />
                                                </div>
                                                <p className="text-xs text-gray-500 mt-1">{mision.progreso}/{mision.total}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Logros */}
                                <div className="bg-white rounded-3xl shadow-2xl p-6">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        🏆 Logros
                                    </h3>
                                    <div className="grid grid-cols-3 gap-3">
                                        {logrosData.map((logro) => (
                                            <div 
                                                key={logro.key}
                                                className={`${
                                                    perfil.logros[logro.key]
                                                        ? 'bg-gradient-to-br from-yellow-100 to-orange-100' 
                                                        : 'bg-gray-100 opacity-50'
                                                } rounded-xl p-3 text-center transition-all hover:scale-105`}
                                            >
                                                <div className="text-3xl mb-1">{logro.icono}</div>
                                                <p className="text-xs font-semibold text-gray-700">{logro.nombre}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Renderizar la aplicación
        ReactDOM.render(<AppMatematicas />, document.getElementById('root'));
    </script>
